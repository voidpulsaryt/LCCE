org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mod properties
mod_id=lcce
mod_name=LCCE
mod_license=MIT
mod_version=0.1.0
mod_group_id=dev.voidpulsaryt.lcce
mod_authors=voidpulsaryt
mod_description=Turns FTB Chunks + FTB Teams into a living, self-managing economy powered by Lightman's Currency.

# Minecraft / loader
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neoforge_version=21.1.209
neoforge_version_range=[21.1.0,)
loader_version_range=[4,)

# Java
java_version=21

# Dependency versions - confirm the exact build against your local mods folder before shipping;
# these are the newest versions that were confirmed to target NeoForge 1.21.1 at time of writing.
architectury_api_version=13.0.8
ftb_library_version=2101.1.34
ftb_teams_version=2101.1.11
ftb_chunks_version=2101.1.22
# Modrinth project slug + version id for Lightman's Currency - update the version id to match
# whatever release you're building against (see https://modrinth.com/mod/lightmans-currency/versions).
lightmanscurrency_version=1.21-2.3.0.5
# BlueMap - optional, server-side only. https://repo.bluecolored.de/releases
bluemap_api_version=2.7.4
